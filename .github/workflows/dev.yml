################################################################################
# .github/workflows/dev.yml
# ---------------------------
# Two jobs:
#   1. security-scan — checkov against all Terraform in the repo (read-only,
#      runs on every trigger including PRs — safe, nothing touches AWS)
#   2. deploy        — applies terraform/lambda-code/ for real (skipped on
#      PRs — see the `if:` condition below for why)
#
# Why checkov specifically for the required security step:
# This project is fundamentally about Terraform. checkov scans the real
# Terraform in this repo for security misconfigurations — not a token
# gesture against a toy example.
#
# Why deploy only touches terraform/lambda-code/, never lambda-infra or
# bootstrap: the GitHub Actions deploy role (created in bootstrap/) has
# permissions scoped EXACTLY to what lambda-code/ needs — it cannot
# create/modify IAM policies, SNS topics, or the analysis cache bucket.
# Pointing this job at any other root would fail on a permissions error,
# by design, not by accident.
################################################################################

name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {} # manual trigger button in the Actions tab

jobs:
  security-scan:
    name: Checkov - Terraform security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 = full history, not the default shallow
          # clone (latest commit only). Required for gitleaks below to
          # scan history at all - a shallow clone would make it
          # functionally blind to anything not in the single latest
          # commit, defeating its actual purpose.
          fetch-depth: 0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          # soft_fail was true during initial triage, to see real findings
          # without blocking every push. All 35 findings now have an
          # explicit disposition (4 remediated, 31 risk-accepted with
          # documented rationale) - see SECURITY-FINDINGS.md and the
          # inline #checkov:skip comments throughout terraform/. With
          # triage complete, this now enforces that any NEW, un-dispositioned
          # finding actually fails the pipeline rather than passing silently.
          soft_fail: false
          # These 5 checks are skipped HERE rather than via inline
          # #checkov:skip comments because, when tested, the inline
          # comments did not actually suppress these findings against
          # the permissions boundary's data "aws_iam_policy_document"
          # block - confirmed by a real failed pipeline run. The exact
          # root cause in checkov wasn't conclusively identified; this
          # workflow-level skip_check approach was tested and confirmed
          # to work. Full rationale for each finding is in
          # SECURITY-FINDINGS.md - this only changes WHERE the
          # suppression is declared, not why each finding is accepted.
          skip_check: CKV_AWS_108,CKV_AWS_109,CKV_AWS_110,CKV_AWS_111,CKV_AWS_356

      # WHY bandit: checkov scans Terraform infrastructure config; it
      # has no visibility into the Lambda's own Python source code.
      # bandit covers a different layer entirely - common Python
      # security anti-patterns (e.g. shell injection, insecure
      # deserialization, hardcoded credentials) inside lambda/ itself.
      # Tested locally against this exact codebase before being wired
      # in here: zero findings, so this is a hard fail from the start,
      # not eased in with soft_fail like checkov needed.
      - name: Set up Python for security scanners
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bandit (Python security linter)
        run: |
          pip install bandit --quiet
          bandit -r lambda/

      # WHY pip-audit: checks the Lambda's declared dependencies
      # (lambda/requirements.txt) against known CVE databases. A
      # dependency can be perfectly configured and still be a real
      # vulnerability if a known-bad version is pinned. Also tested
      # clean locally against this exact requirements file first.
      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip install pip-audit --quiet
          pip-audit -r lambda/requirements.txt

      # WHY gitleaks: scans git history (not just the current working
      # tree) for accidentally committed secrets - API keys, tokens,
      # credentials. This catches a class of leak the other three
      # tools don't: something that was committed and later removed,
      # which still lives in history unless the repo itself is rewritten.
      #
      # Installed as the raw binary rather than the official
      # gitleaks/gitleaks-action: that action's license (proprietary
      # since v2.0.0) only requires a paid key for GitHub
      # Organization-owned repos, not personal accounts like this one
      # - but calling the CLI directly keeps every scanner in this job
      # on the same footing (a plain tool install, no third-party
      # action's terms to track) and matches exactly what was already
      # verified locally before wiring this in.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks (secret scanning, full git history)
        run: gitleaks detect --source . --verbose

  deploy:
    name: Deploy Lambda (terraform/lambda-code)
    runs-on: ubuntu-latest
    needs: security-scan

    # WHY THIS CONDITION: running `terraform apply` against real AWS
    # infrastructure on every pull request — including ones that haven't
    # been reviewed or merged yet — would mean unreviewed code could
    # deploy itself. checkov still runs on PRs (read-only, safe). Actual
    # deployment only happens on a real push to dev, or a manual run.
    if: github.event_name != 'pull_request'

    # WHY THIS PERMISSIONS BLOCK: GitHub Actions jobs get NO permissions
    # by default for requesting an OIDC token. Without this exact block,
    # the configure-aws-credentials step below fails — this is the single
    # most commonly forgotten requirement when wiring up GitHub OIDC, and
    # it fails with a generic-looking error that doesn't obviously point
    # back to this missing block.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # WHY OIDC INSTEAD OF STORED CREDENTIALS: no long-lived AWS access
      # keys exist in GitHub at all. This step exchanges a short-lived
      # OIDC token (proving "this really is a run of THIS repo, on THIS
      # branch") for temporary AWS credentials, scoped to exactly the
      # tfdriftmonitor-github-deploy role created in terraform/bootstrap/.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pinned to 3.12 to exactly match the Lambda runtime. build.sh
      # already targets 3.12 explicitly via pip's --python-version flag
      # regardless of what's running it, so this isn't strictly required
      # — but pinning removes an entire class of "worked locally, broke
      # on a future Actions runner image" risk for negligible cost.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to match the version used for all local development this
      # session (1.15.x) — required_version >= 1.11 in versions.tf would
      # catch a real mismatch anyway, but pinning here means CI never
      # silently picks up a newer Terraform release before it's been
      # tested locally first.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      # WHY -backend-config FLAGS INSTEAD OF A HARDCODED BUCKET NAME:
      # Terraform backend blocks cannot use variables or interpolation —
      # see terraform/lambda-code/backend.tf for the full explanation.
      # STATE_BUCKET is unpredictable by design (same reasoning as the
      # deployments bucket), so it's supplied here from a repo variable,
      # never committed as a literal string anywhere in this repo.
      - name: Terraform init
        working-directory: terraform/lambda-code
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # Kept as its own visible step for audit purposes — anyone reviewing
      # a run in the Actions tab can see exactly what changed, even though
      # nothing currently gates on this step's output (no human reviews
      # plan output before apply on dev — see prod.yml, not yet built, for
      # where that gate belongs).
      - name: Terraform plan
        working-directory: terraform/lambda-code
        run: terraform plan

      # -auto-approve because there's no human in this loop to type "yes"
      # — the interactive confirmation prompt every local apply this
      # session has required simply has no equivalent in a non-interactive
      # CI run. This is standard practice for CI/CD specifically; it does
      # NOT mean confirmation is skipped everywhere — local applies to
      # terraform/bootstrap/ and terraform/lambda-infra/ still require a
      # human to type "yes", since those roots are never applied by CI.
      - name: Terraform apply
        working-directory: terraform/lambda-code
        run: terraform apply -auto-approve
